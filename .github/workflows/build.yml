name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build (byte budgets, secret scan, frontmatter lint)
        run: python3 build.py

      - name: Fail if dist/ is stale
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is stale. Run 'python3 build.py' and commit the result."
            git --no-pager diff --stat -- dist/
            exit 1
          fi

      - name: Vendor lock integrity
        run: python3 build.py --verify-vendor

      - name: No legacy CLAUDE.md artifacts or references
        run: |
          if git grep -in claude -- . ':!.github/workflows/build.yml'; then
            echo "::error::CLAUDE.md references remain; this distribution is AGENTS.md-only"
            exit 1
          fi

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -x -s sh bin/airules lib/common.sh scripts/sync-vendor.sh

      - name: Smoke test — clean HOME, install then uninstall
        run: |
          export HOME=$(mktemp -d)
          ./bin/airules install --repo "$GITHUB_WORKSPACE" --no-schedule --yes
          ./bin/airules status
          ./bin/airules doctor
          ./bin/airules uninstall --purge
          if find "$HOME" -name 'airules-*' -print -quit | grep -q .; then
            echo "::error::uninstall left residue"; exit 1
          fi

      - name: Smoke test — existing notes and config survive
        run: |
          export HOME=$(mktemp -d)
          mkdir -p "$HOME/.config/opencode" "$HOME/.codex"
          printf 'my own notes\n' > "$HOME/.config/opencode/AGENTS.md"
          printf 'my own codex notes\n' > "$HOME/.codex/AGENTS.md"
          printf 'model = "test"\n' > "$HOME/.codex/config.toml"
          ./bin/airules install --repo "$GITHUB_WORKSPACE" --no-schedule --yes
          ./bin/airules install --repo "$GITHUB_WORKSPACE" --no-schedule --yes
          python3 - <<'PY'
          import os
          home = os.environ["HOME"]
          oc = open(home + "/.config/opencode/AGENTS.md").read()
          cx = open(home + "/.codex/AGENTS.md").read()
          cfg = open(home + "/.codex/config.toml").read()
          assert "my own notes" in oc, oc
          assert "my own codex notes" in cx, cx
          assert 'model = "test"' in cfg, cfg
          assert "airules managed block" in oc and "airules managed block" in cx
          assert oc.count(">>> airules managed block >>>") == 1, "duplicated block on re-install"
          assert cx.count(">>> airules managed block >>>") == 1, "duplicated block on re-install"
          assert "/dist/rules/airules-" in cx, "codex pointers missing"
          PY
          ./bin/airules uninstall
          python3 - <<'PY'
          import os
          home = os.environ["HOME"]
          oc = open(home + "/.config/opencode/AGENTS.md").read()
          cx = open(home + "/.codex/AGENTS.md").read()
          assert oc.strip() == "my own notes", oc
          assert cx.strip() == "my own codex notes", cx
          sk = home + "/.config/opencode/skills"
          assert not os.path.exists(sk) or not os.listdir(sk), "skills left behind"
          PY
